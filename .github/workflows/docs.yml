name: docs

# Builds the Sphinx documentation with the repository's own scripts
# (dev/sphinx/install_sphinx.sh, dev/sphinx/create_docs.sh) and publishes it
# to GitHub Pages. Pull requests build only, as a check; a push to master (or
# a manual run) builds and deploys. Replaces building the docs locally and
# committing docs/ — Pages must be set to "GitHub Actions" as its source
# (Settings → Pages → Build and deployment → Source) for the deploy to land.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Sphinx and the theme
        run: bash dev/sphinx/install_sphinx.sh
      - name: Build the docs into docs/
        run: bash dev/sphinx/create_docs.sh
      - name: Fail if the build produced no index
        run: test -s docs/index.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
